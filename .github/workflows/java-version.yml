name: Java migration verification
on:
  push:
    branches: [main, java-version, feat/purchase-audit-trace]
  pull_request:
    branches: [main, java-version, feat/purchase-audit-trace]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_test_password
          POSTGRES_DB: kasinlo_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: mkdir -p backend-java/src/main/resources/static && cp -R frontend/dist/. backend-java/src/main/resources/static/
      - run: mvn -B -f backend-java/pom.xml verify
      - name: H2 business and concurrency verification
        run: python backend-java/tools/review-smoke.py backend-java/target/kasinlo-erp-2.0.0-java-SNAPSHOT.jar
      - name: PostgreSQL business and concurrency verification
        env:
          ERP_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/kasinlo_test
          ERP_DATABASE_USER: erp
          ERP_DATABASE_PASSWORD: erp_test_password
        run: python backend-java/tools/review-smoke.py backend-java/target/kasinlo-erp-2.0.0-java-SNAPSHOT.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kasinlo-java-review
          path: |
            backend-java/target/*.jar
            /tmp/kasinlo-review-results.json
            /tmp/kasinlo-java-test-server.log
