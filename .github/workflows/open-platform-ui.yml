name: Open platform UI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/open-platform-ui-verify.mjs'
      - '.github/workflows/open-platform-ui.yml'

permissions:
  contents: read

jobs:
  authorization-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:open-platform-ui
        working-directory: frontend
        env:
          QA_OUTPUT: ${{ runner.temp }}/open-platform-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-platform-ui-screenshots
          path: ${{ runner.temp }}/open-platform-ui
          if-no-files-found: ignore
