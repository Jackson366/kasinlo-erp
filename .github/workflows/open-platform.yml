name: Open platform

on:
  pull_request:
    paths:
      - 'open-platform/**'
      - 'backend/**'
      - 'frontend/src/api/openPlatform.ts'
      - 'frontend/src/views/open-platform/**'
      - 'frontend/src/router/index.ts'
      - '.github/workflows/open-platform.yml'

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: open-platform/go.mod
          cache-dependency-path: |
            open-platform/go.sum
            backend/go.sum
      - run: go test ./...
        working-directory: open-platform
        env:
          PLATFORM_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
      - run: go test ./internal/config ./internal/assembly ./internal/middleware ./internal/module/inv ./internal/module/openplatform
        working-directory: backend
      - run: bash scripts/check-module-boundary.sh
