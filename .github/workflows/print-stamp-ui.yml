name: Print stamp UI
on:
  pull_request:
    paths: ['frontend/**', 'scripts/print-stamp-verify.mjs', '.github/workflows/print-stamp-ui.yml']
permissions:
  contents: read
jobs:
  print-stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:print-stamp
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: print-stamp-evidence
          path: /tmp/kasinlo-print-stamp-qa
