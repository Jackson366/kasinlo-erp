name: Purchase UI
on:
  pull_request:
    paths:
      [
        'frontend/**',
        'scripts/purchase-workbench-verify.mjs',
        'scripts/purchase-audit-verify.mjs',
        '.github/workflows/purchase-ui.yml',
      ]
  push:
    branches: [main, java-version, 'feat/purchase-workbench', 'feat/purchase-audit-trace']
    paths:
      [
        'frontend/**',
        'scripts/purchase-workbench-verify.mjs',
        'scripts/purchase-audit-verify.mjs',
        '.github/workflows/purchase-ui.yml',
      ]
permissions:
  contents: read
jobs:
  purchase-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:purchase && npm run test:purchase-audit
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purchase-ui-evidence
          path: |
            /tmp/kasinlo-purchase-qa
            /tmp/kasinlo-purchase-audit-qa
