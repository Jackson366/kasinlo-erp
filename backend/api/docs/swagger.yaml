            $ref: '#/definitions/response.Body'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - 用户管理
    get:
      description: 超出调用者数据范围时按「不存在」返回 404，不泄露该用户是否存在。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/user.VO'
              type: object
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 查询用户详情
      tags:
      - 用户管理
    put:
      consumes:
      - application/json
      description: roleIds 传 null 表示不调整角色；传数组则为覆盖式设置，并校验调用者有权授予这些角色。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 修改参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.UpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: 无权授予所选角色 / 无权操作超管账号
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 修改用户
      tags:
      - 用户管理
  /system/users/{id}/password:
    put:
      consumes:
      - application/json
      description: 重置后该用户所有已签发令牌立即失效，需重新登录。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 新密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.ResetPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: 密码已重置
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 密码长度不能少于 6 位
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 重置用户密码
      tags:
      - 用户管理
  /system/users/{id}/status:
    put:
      consumes:
      - application/json
      description: 禁用会把 token_epoch 加一，使该用户已签发的令牌立即失效。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 目标状态
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.StatusReq'
      produces:
      - application/json
      responses:
        "200":
          description: 状态已更新
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 内置管理员或当前登录用户不允许禁用
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 启用或禁用用户
      tags:
      - 用户管理
  /system/users/export:
    get:
      description: 返回 xlsx 二进制流。导出的行集与列表完全一致（含数据范围约束）；单次上限见 MaxExportRows。
      parameters:
      - description: 选中导出的用户 ID，逗号分隔；提供时忽略其他筛选条件
        in: query
        name: ids
        type: string
      - description: 按用户名 / 昵称 / 手机号模糊搜索
        in: query
        name: keyword
        type: string
      - description: 部门 ID（含子部门）
        in: query
        name: deptId
        type: integer
      - description: 状态：1 启用，0 禁用
        in: query
        name: status
        type: integer
      - description: 角色 ID
        in: query
        name: roleId
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: xlsx 文件流
          schema:
            type: file
        "400":
          description: 无可导出数据 / 超出单次导出上限
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 按筛选条件导出用户
      tags:
      - 用户管理
  /system/users/import:
    post:
      consumes:
      - multipart/form-data
      description: |-
        上传 xlsx（仅支持 .xlsx，≤5MB，≤1000 行）。dryRun=1 时只校验并逐行返回结果，不写库。
        导入同样受数据范围约束，且角色授予会被校验。
      parameters:
      - description: 为 1/true 时只校验不写库
        enum:
        - "1"
        - "true"
        in: query
        name: dryRun
        type: string
      - description: 导入文件（.xlsx）
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/user.ImportResult'
              type: object
        "400":
          description: 文件为空 / 格式不支持 / 表头不匹配 / 超出行数上限
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: 文件中的角色超出可授予范围（权限或数据范围）
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: 导入时出现唯一性冲突
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 批量导入用户
      tags:
      - 用户管理
  /system/users/import-template:
    get:
      description: 返回 xlsx 二进制流。模板数据区为空，填写说明在第二个工作表中。
      produces:
      - application/octet-stream
      responses:
        "200":
          description: xlsx 文件流
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: 下载用户导入模板
      tags:
      - 用户管理
  /system/users/options:
    get:
      description: 仅返回启用状态、且在调用者数据范围内的用户，最多 100 条。
      parameters:
      - description: 按用户名 / 昵称模糊搜索
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/user.Option'
                  type: array
              type: object
        "403":
          description: 缺少 system:user:list / system:role:list / system:dept:list 权限
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 用户下拉选项
      tags:
      - 用户管理
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 填写 "Bearer <accessToken>"，注意 Bearer 与令牌之间有一个空格
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
