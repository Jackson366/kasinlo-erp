      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/response.IDData'
              type: object
      security:
      - BearerAuth: []
      summary: 新增客户
      tags:
