info:
  contact:
    name: Nova ERP 开发组
  description: |-
    基于 Gin + GORM + PostgreSQL 的权限管理后台后端。
    所有接口统一返回 {code, message, data, traceId}，业务码 0 表示成功。
    业务码前三位即 HTTP 状态码：40000→400、40100~40106→401、40300→403、40400→404、40900→409、42900→429、50000/50100→500。
    除「登录」「刷新令牌」外，所有接口都需要请求头 `Authorization: Bearer <accessToken>`。
    接口前缀由 config.yaml 的 app.prefix + app.version 决定，服务启动时会同步到本文档。
  license:
    name: MIT
  termsOfService: https://example.com/terms/
  title: Nova ERP API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        校验用户名与密码，成功后返回访问令牌与刷新令牌。
        连续失败会触发「账号 + 来源 IP」锁定（40103）；同一来源 IP 失败过多会返回 429。
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResp'
              type: object
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: 用户名或密码错误 / 账号被禁用 / 账号被锁定
          schema:
            $ref: '#/definitions/response.Body'
        "429":
          description: 来源 IP 请求过于频繁
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.Body'
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      description: 服务端把该用户的令牌版本号（token_epoch）加一并清理身份缓存，已签发的访问/刷新令牌立即失效（会同时结束该用户其他设备的会话）；客户端应同时丢弃本地令牌。
      produces:
      - application/json
      responses:
        "200":
          description: 已退出登录
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: 未登录或令牌失效
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 退出登录
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        用刷新令牌换取新的令牌对。改密码 / 重置密码 / 禁用账号后，旧刷新令牌会立即失效。
        该接口按 IP 做请求频率限制，超出返回 429。
      parameters:
      - description: 刷新令牌
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResp'
              type: object
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: 刷新令牌无效或已过期
          schema:
            $ref: '#/definitions/response.Body'
        "429":
          description: 请求过于频繁
          schema:
            $ref: '#/definitions/response.Body'
      summary: 刷新访问令牌
      tags:
      - 认证
  /inv/categories:
    get:
      parameters:
      - description: 页码
        in: query
