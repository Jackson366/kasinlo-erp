basePath: /api/v1
definitions:
  auth.LoginReq:
    properties:
      password:
        maxLength: 64
        minLength: 6
        type: string
      username:
        maxLength: 64
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  auth.LoginResp:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      refreshToken:
        type: string
      tokenType:
        type: string
      user: {}
    type: object
  auth.RefreshReq:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  dept.CreateReq:
    properties:
      email:
        maxLength: 128
        type: string
      leader:
        maxLength: 64
        type: string
      name:
        maxLength: 64
        type: string
      parentId:
        type: integer
      phone:
        maxLength: 32
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - name
    type: object
  dept.Node:
    properties:
      children:
        items:
          $ref: '#/definitions/dept.Node'
        type: array
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      leader:
        type: string
      name:
        type: string
      parentId:
        type: integer
      phone:
        type: string
      sort:
        type: integer
      status:
        type: integer
      userCount:
        type: integer
    type: object
  dept.UpdateReq:
    properties:
      email:
        maxLength: 128
        type: string
      leader:
        maxLength: 64
        type: string
      name:
        maxLength: 64
        type: string
      parentId:
        type: integer
      phone:
        maxLength: 32
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - name
    type: object
  internal_module_ops.CleanupStep:
    properties:
      batches:
        type: integer
      cutoff:
        type: string
      name:
        type: string
      note:
        type: string
      rows:
        type: integer
      table:
        type: string
    type: object
  internal_module_ops.UpgradeAction:
    properties:
      detail:
        type: string
      done:
        type: boolean
      error:
        type: string
      key:
        type: string
      title:
        type: string
    type: object
  inv.CategoryOption:
    properties:
      id:
        type: integer
      name:
        type: string
      parentId:
        type: integer
    type: object
  inv.CategoryReq:
    properties:
      name:
        maxLength: 64
        type: string
      parentId:
        description: 0 = 根分类
        type: integer
      remark:
        maxLength: 255
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - name
    type: object
  inv.CategoryRow:
    properties:
      childCount:
        description: 子分类数，删除校验要用
        type: integer
      createdAt:
        type: string
      id:
        type: integer
      name:
        type: string
      parentId:
        type: integer
      productCount:
        type: integer
      remark:
        type: string
      sort:
        type: integer
      status:
        type: integer
    type: object
  inv.FinanceRow:
    properties:
      dueDate:
        description: 选填：未填时为 null，不参与逾期判定
        type: string
      orderDate:
        type: string
      orderId:
        type: integer
      orderNo:
        type: string
      outstanding:
        type: number
      overdue:
        type: boolean
      partyId:
        type: integer
      partyName:
        type: string
      settleStatus:
        type: string
      settledAmount:
        type: number
      totalAmount:
        type: number
    type: object
  inv.InvCategoryValueRow:
    properties:
      category:
        type: string
      ratio:
        type: number
      value:
        description: 库存金额（按基本单位采购价计价）
        type: number
    type: object
  inv.InvWarnStockRow:
    properties:
      productCode:
        type: string
      productId:
        type: integer
      productName:
        type: string
      spec:
        type: string
      specId:
        type: integer
      stock:
        type: number
      unit:
        description: 基本单位（库存的计数单位）
        type: string
      warnStock:
        type: number
    type: object
  inv.InventoryRow:
    properties:
      categoryName:
        type: string
      productCode:
        type: string
      productId:
        type: integer
      productName:
        type: string
      purchasePrice:
        description: 基本单位的采购价，用于算库存成本
        type: number
      spec:
        type: string
      specId:
        type: integer
      stock:
        type: number
      unit:
        description: 基本单位（库存的计数单位）
        type: string
      unitId:
        type: integer
      warn:
        type: boolean
      warnStock:
        type: number
    type: object
  inv.OrderDetail:
    properties:
      bizType:
        type: string
      createdAt:
        type: string
      dueDate:
        description: 选填：未填时为 null
        type: string
      id:
        type: integer
      itemCount:
        type: integer
      items:
        items:
          $ref: '#/definitions/inv.OrderItemVO'
        type: array
      operator:
        description: Operator 制单人显示名（昵称优先，回落用户名）。列表直接用，省得前端再查一次人。
        type: string
      orderDate:
        type: string
      orderNo:
        type: string
      partyId:
        type: integer
      partyName:
        type: string
      remark:
        type: string
      salesman:
        type: string
      settleStatus:
        type: string
      settledAmount:
        type: number
      status:
        type: integer
      totalAmount:
        type: number
    type: object
  inv.OrderItemReq:
    properties:
      price:
        minimum: 0
        type: number
      productId:
        type: integer
      qty:
        type: number
      specId:
        type: integer
      unitId:
        type: integer
    required:
    - productId
    - qty
    - specId
    - unitId
    type: object
  inv.OrderItemVO:
    properties:
      amount:
        type: number
      id:
        type: integer
      price:
        type: number
      productCode:
        type: string
      productId:
        type: integer
      productName:
        type: string
      qty:
        type: number
      qtyBase:
        type: number
      rate:
        type: number
      spec:
        type: string
      specId:
        type: integer
      unit:
        type: string
      unitId:
        type: integer
    type: object
  inv.OrderReq:
    properties:
      bizType:
        enum:
        - purchase
        - sales
        type: string
      dueDate:
        type: string
      items:
        items:
          $ref: '#/definitions/inv.OrderItemReq'
        minItems: 1
        type: array
      orderDate:
        type: string
      orderNo:
        description: OrderNo 单据编号。留空自动生成（CG/XS + 日期 + 流水）；填了用手工值（重复会 409）。
        maxLength: 32
        type: string
      partyId:
        type: integer
      remark:
        maxLength: 255
        type: string
      salesman:
        maxLength: 64
        type: string
    required:
    - bizType
    - items
    - orderDate
    - partyId
    type: object
  inv.OrderRow:
    properties:
      bizType:
        type: string
      createdAt:
        type: string
      dueDate:
        description: 选填：未填时为 null
        type: string
      id:
        type: integer
      itemCount:
        type: integer
      operator:
        description: Operator 制单人显示名（昵称优先，回落用户名）。列表直接用，省得前端再查一次人。
        type: string
      orderDate:
        type: string
      orderNo:
        type: string
      partyId:
        type: integer
      partyName:
        type: string
      remark:
        type: string
      salesman:
        type: string
      settleStatus:
        type: string
      settledAmount:
        type: number
      status:
        type: integer
      totalAmount:
        type: number
    type: object
  inv.OverviewVO:
    properties:
      activeCustomer:
        type: integer
      customerCount:
        type: integer
      monthNewCustomer:
        type: integer
      monthPurchase:
        type: number
      monthSales:
        type: number
      payableTotal:
        type: number
      pendingOrders:
        type: integer
      productCount:
        type: integer
      receivableTotal:
        type: number
      warnProductCount:
        type: integer
    type: object
  inv.PartyReq:
    properties:
      address:
        maxLength: 255
        type: string
      code:
        description: Code 留空时由服务端自动生成（客户 KH#### / 供应商 GYS####）；填了就用手工值（唯一性照常校验）。
        maxLength: 32
        type: string
      contact:
        maxLength: 64
        type: string
      name:
        maxLength: 128
        type: string
      phone:
        maxLength: 32
        type: string
      remark:
        maxLength: 255
        type: string
      status:
        enum:
        - 0
        - 1
        type: integer
      taxNo:
        maxLength: 64
        type: string
    required:
    - name
    type: object
  inv.PartyRow:
    properties:
      address:
        type: string
      balance:
        type: number
      code:
        type: string
      contact:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      name:
        type: string
      orderCount:
        type: integer
      phone:
        type: string
      remark:
        type: string
      status:
        type: integer
      taxNo:
        type: string
    type: object
  inv.PickSpecVO:
    properties:
      id:
        type: integer
      spec:
        type: string
      stock:
        type: number
      units:
        items:
          $ref: '#/definitions/inv.PickUnitVO'
        type: array
    type: object
  inv.PickUnitVO:
    properties:
      id:
        type: integer
      isBase:
        type: boolean
      purchasePrice:
        type: number
      rate:
        type: number
      salePrice:
        type: number
      unit:
        type: string
    type: object
  inv.PrintTemplateReq:
    properties:
      code:
        maxLength: 32
        type: string
      content:
        maxLength: 8000
        type: string
      docType:
        maxLength: 32
        type: string
      name:
        maxLength: 64
        type: string
      paper:
        enum:
        - A4
        - A5
        type: string
      remark:
        maxLength: 255
        type: string
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - code
    - name
    type: object
  inv.PrintTemplateRow:
    properties:
      code:
        type: string
      content:
        type: string
      createdAt:
        type: string
      docType:
        type: string
      id:
        type: integer
      name:
        type: string
      paper:
        type: string
      remark:
        type: string
      status:
        type: integer
    type: object
  inv.ProductDupRow:
    properties:
      categoryName:
        type: string
      code:
        type: string
      id:
        type: integer
      name:
        type: string
      specSummary:
        type: string
      status:
        type: integer
    type: object
  inv.ProductPickResult:
    properties:
      items:
        items:
          $ref: '#/definitions/inv.ProductPickVO'
        type: array
      total:
        type: integer
      truncated:
        type: boolean
    type: object
  inv.ProductPickVO:
    properties:
      barcode:
        type: string
      code:
        type: string
      id:
        type: integer
      name:
        type: string
      specs:
        items:
          $ref: '#/definitions/inv.PickSpecVO'
        type: array
    type: object
  inv.ProductReq:
    properties:
      barcode:
        maxLength: 64
        type: string
      categoryId:
        type: integer
      code:
        description: Code 留空时由服务端自动生成（SP####）；填了就用手工值（唯一性照常校验）。
        maxLength: 32
        type: string
      name:
        maxLength: 128
        type: string
      refPurchasePrice:
        description: |-
          参考进价 / 参考售价：商品级备忘价。具体成交价仍以规格-单位上的
          采购价 / 销售价为准，参考价用于开单前的估价与对比。
        minimum: 0
        type: number
      refSalePrice:
        minimum: 0
        type: number
      remark:
        maxLength: 255
        type: string
      specs:
        items:
          $ref: '#/definitions/inv.ProductSpecReq'
        type: array
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - name
    type: object
  inv.ProductRow:
    properties:
      barcode:
        type: string
      categoryId:
        type: integer
      categoryName:
        type: string
      code:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      name:
        type: string
      refPurchasePrice:
        type: number
      refSalePrice:
        type: number
      remark:
        type: string
      specCount:
        type: integer
      specs:
        items:
          $ref: '#/definitions/inv.ProductSpecVO'
        type: array
      status:
        type: integer
      totalStock:
        type: number
      unitCount:
        type: integer
      warn:
        type: boolean
    type: object
  inv.ProductSpecReq:
    properties:
      id:
        type: integer
      spec:
        maxLength: 64
        type: string
      status:
        enum:
        - 0
        - 1
        type: integer
      units:
        items:
          $ref: '#/definitions/inv.ProductUnitReq'
        type: array
      warnStock:
        minimum: 0
        type: number
    type: object
  inv.ProductSpecVO:
    properties:
      id:
        type: integer
      spec:
        type: string
      status:
        type: integer
      stock:
        type: number
      units:
        items:
          $ref: '#/definitions/inv.ProductUnitVO'
        type: array
      warn:
        type: boolean
      warnStock:
        type: number
    type: object
  inv.ProductUnitReq:
    properties:
      isBase:
        type: boolean
      purchasePrice:
        minimum: 0
        type: number
      rate:
        minimum: 0
        type: number
      salePrice:
        minimum: 0
        type: number
      status:
        enum:
        - 0
        - 1
        type: integer
      unit:
        maxLength: 16
        type: string
    type: object
  inv.ProductUnitVO:
    properties:
      id:
        type: integer
      isBase:
        type: boolean
      purchasePrice:
        type: number
      rate:
        type: number
      salePrice:
        type: number
      status:
        type: integer
      unit:
        type: string
    type: object
  inv.ReportCategoryRow:
    properties:
      amount:
        type: number
      category:
        type: string
      ratio:
        type: number
    type: object
  inv.ReportInventory:
    properties:
      categoryValue:
        description: 品类库存金额分布
        items:
          $ref: '#/definitions/inv.InvCategoryValueRow'
        type: array
      specCount:
        description: 启用规格数
        type: integer
      totalValue:
        description: 库存总金额（成本价）
        type: number
      warnCount:
        description: 低库存预警规格数
        type: integer
      warnList:
        description: 低库存预警清单（前 20）
        items:
          $ref: '#/definitions/inv.InvWarnStockRow'
        type: array
    type: object
  inv.ReportRankRow:
    properties:
      amount:
        description: 销售 / 采购金额
        type: number
      id:
        description: 对应档案 ID（party_id / product_id）
        type: integer
      name:
        description: 客户名 / 供应商名 / 商品名
        type: string
      orderCount:
        description: 单据数（客户/供应商）或涉及订单数（商品）
        type: integer
      quantity:
        description: 商品维度：总销量（基本单位）；客户维度为 0
        type: number
      rank:
        type: integer
      ratio:
        type: number
    type: object
  inv.ReportSummary:
    properties:
      costAmount:
        type: number
      grossProfit:
        type: number
      grossRate:
        type: number
      purchaseOrders:
        type: integer
      purchases:
        type: number
      range:
        type: string
      salesAmount:
        type: number
      salesOrders:
        type: integer
    type: object
  inv.ReportTrendPoint:
    properties:
      date:
        type: string
      purchaseAmount:
        type: number
      salesAmount:
        type: number
    type: object
  inv.SettleReq:
    properties:
      amount:
        type: number
      method:
        maxLength: 32
        type: string
      orderId:
        type: integer
      remark:
        maxLength: 255
        type: string
      settledAt:
        type: string
    required:
    - amount
    - orderId
    type: object
  inv.StatusReq:
    properties:
      settleNow:
        description: |-
          SettleNow 仅审核（status=2）时有效：审核通过后立即按全额登记一笔
          收 / 付款（采购 → 付款、销售 → 收款），适合「一手交钱一手交货」。
        type: boolean
      status:
        enum:
        - 1
        - 2
        - 3
        type: integer
    required:
    - status
    type: object
  inv.StockItemReq:
    properties:
      productId:
        type: integer
      qty:
        type: number
      specId:
        type: integer
      unitId:
        type: integer
    required:
    - productId
    - qty
    - specId
    - unitId
    type: object
  inv.StockOrderDetail:
    properties:
      direction:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/inv.StockPrintItem'
        type: array
      operator:
        description: 制单人昵称
        type: string
      orderDate:
        type: string
      orderNo:
        type: string
      remark:
        type: string
      salesman:
        description: 业务员
        type: string
      sourceOrderNo:
        description: 来源采购 / 销售单号，手工单为空
        type: string
      sourceType:
        type: string
      totalQty:
        type: number
    type: object
  inv.StockOrderReq:
    properties:
      direction:
        enum:
        - in
        - out
        type: string
      items:
        items:
          $ref: '#/definitions/inv.StockItemReq'
        minItems: 1
        type: array
      orderDate:
        type: string
      orderNo:
        description: OrderNo 单据编号。留空自动生成（CK + 日期 + 流水）；填了用手工值（重复会 409）。
        maxLength: 32
        type: string
      remark:
        maxLength: 255
        type: string
      salesman:
        maxLength: 64
        type: string
      sourceType:
        enum:
        - purchase
        - sales
        - manual
        type: string
    required:
    - direction
    - items
    - orderDate
    type: object
  inv.StockOrderRow:
    properties:
      createdAt:
        type: string
      direction:
        type: string
      id:
        type: integer
      itemCount:
        type: integer
      operator:
        description: Operator 制单人显示名（昵称优先，回落用户名）
        type: string
      orderDate:
        type: string
      orderNo:
        type: string
      remark:
        type: string
      salesman:
        type: string
      sourceId:
        type: integer
      sourceType:
        type: string
      status:
        type: integer
      totalQty:
        type: number
    type: object
  inv.StockPrintItem:
    properties:
      productCode:
        type: string
      productName:
        type: string
      qty:
        type: number
      qtyBase:
        type: number
      rate:
        type: number
      spec:
        type: string
      unit:
        type: string
      unitBase:
        description: 基本单位名，用于把基本数量写清楚
        type: string
    type: object
  log.ClearReq:
    properties:
      before:
        type: string
    type: object
  menu.CreateReq:
    properties:
      component:
        maxLength: 255
        type: string
      hidden:
        type: boolean
      icon:
        maxLength: 64
        type: string
      isExternal:
        type: boolean
      keepAlive:
        type: boolean
      name:
        maxLength: 64
        type: string
      parentId:
        type: integer
      path:
        maxLength: 255
        type: string
      permission:
        maxLength: 128
        type: string
      redirect:
        maxLength: 255
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
      title:
        maxLength: 64
        type: string
      type:
        enum:
        - dir
        - menu
        - button
        type: string
    required:
    - name
    - title
    - type
    type: object
  menu.Node:
    properties:
      children:
        items:
          $ref: '#/definitions/menu.Node'
        type: array
      component:
        type: string
      hidden:
        type: boolean
      icon:
        type: string
      id:
        type: integer
      isExternal:
        type: boolean
      keepAlive:
        type: boolean
      name:
        type: string
      parentId:
        type: integer
      path:
        type: string
      permission:
        type: string
      redirect:
        type: string
      sort:
        type: integer
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  menu.Route:
    properties:
      children:
        items:
          $ref: '#/definitions/menu.Route'
        type: array
      component:
        type: string
      id:
        type: integer
      meta:
        $ref: '#/definitions/menu.RouteMeta'
      name:
        type: string
      path:
        type: string
      redirect:
        type: string
    type: object
  menu.RouteMeta:
    properties:
      hidden:
        type: boolean
      icon:
        type: string
      isExternal:
        type: boolean
      keepAlive:
        type: boolean
      permission:
        type: string
      title:
        type: string
    type: object
  menu.UpdateReq:
    properties:
      component:
        maxLength: 255
        type: string
      hidden:
        type: boolean
      icon:
        maxLength: 64
        type: string
      isExternal:
        type: boolean
      keepAlive:
        type: boolean
      name:
        maxLength: 64
        type: string
      parentId:
        type: integer
      path:
        maxLength: 255
        type: string
      permission:
        maxLength: 128
        type: string
      redirect:
        maxLength: 255
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
      title:
        maxLength: 64
        type: string
      type:
        enum:
        - dir
        - menu
        - button
        type: string
    required:
    - name
    - title
    - type
