# Nova ERP 服务端配置模板
#
# 用法：复制本文件为同目录的 config.yaml，按实际情况填写后再启动服务。
#     cp config.example.yaml config.yaml
#
# 为什么 config.yaml 不进版本库：
#   它包含数据库口令。真实口令一旦提交就会永久留在 git 历史里，
#   即使后续改回来也能从历史中读到。
#
# 所有配置项均可用环境变量覆盖，规则：NOVA_<SECTION>_<KEY>，例如 NOVA_DATABASE_PASSWORD。
# 因此 CI / 容器里可以完全不落盘口令，直接靠环境变量注入。
app:
  name: nova-erp        # 应用名
  mode: debug             # debug | release
  host: 0.0.0.0
  port: 6802
  prefix: /api            # 路由统一前缀
  version: v1             # API 版本段，最终前缀为 /api/v1
  # 是否挂载在线接口文档（/swagger/index.html）。
  # 不写则跟随 mode：debug 打开、release 关闭 —— 接口文档会暴露全部路由与参数结构，
  # 生产环境默认不该对外可见。需要时可用 NOVA_APP_SWAGGER=true 覆盖。
  swagger: true
  # 是否挂载 /metrics 监控端点（Prometheus 文本格式）。
  # 默认**关闭**：该端点会暴露路由表、请求量与状态码分布，不该像 swagger 那样
  # 随 mode 自动放开。接入 Prometheus 时才打开，并建议同时配置 metrics_token。
  metrics: false
  # 非空时，抓取 /metrics 必须带 Authorization: Bearer <token>。
  # 也可以用 NOVA_APP_METRICS_TOKEN 注入，避免把令牌落到配置文件里。
  metrics_token: ""

database:
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: CHANGE_ME     # ← 改成你本机 PostgreSQL 的口令
  dbname: nova_inv_v5      # 库不存在时会自动创建
  sslmode: disable
  timezone: Asia/Shanghai
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600   # 秒
  log_level: warn           # silent | error | warn | info
  # 单条 SQL 在 PostgreSQL 侧的执行上限（毫秒），默认 30000。
  # 放在数据库侧才能真正掐断查询：应用层超时只能让调用方不再等待，
  # 查询本身仍在数据库里继续跑、继续占连接。
  statement_timeout: 30000

jwt:
  # ← 上线前务必换成随机长字符串，否则任何人都能用这个公开值伪造令牌
  secret: CHANGE_ME_USE_A_RANDOM_LONG_STRING
  issuer: nova-erp
  access_expire: 7200       # 访问令牌有效期（秒），默认 2 小时
  refresh_expire: 604800    # 刷新令牌有效期（秒），默认 7 天

log:
  level: info               # debug | info | warn | error
  format: console           # console | json
  dir: ./logs               # 留空则不落盘，只输出到 stdout
  file: app.log
  # 落盘轮转：单文件超限切分，保留 N 个备份，超龄清理。三项都可不写（走默认 100 / 7 / 30）。
  # 不配轮转的话，长时间运行的单个日志文件会一直增长直到吃满磁盘。
  max_size_mb: 100          # 单个日志文件大小上限（MB）
  max_backups: 7            # 最多保留的历史文件个数
  max_age_days: 30          # 历史文件保留天数

cors:
  # 生产环境请改成具体域名，`*` 仅适合本地开发
  allow_origins:
    - "*"

security:
  # 登录失败连续锁定阈值（按「账号 + 来源 IP」计数）
  max_login_fail: 5
  # 锁定时间（秒）
  login_lock_seconds: 300
  # 同一来源 IP 在一个锁定窗口内的登录失败上限，用于拦截「一个出口 IP 撞库大量账号」。
  # 只统计失败：登录成功即清零，因此不会牵连 NAT / 公司网关后的正常用户。
  # 设为 0 表示关闭。默认 30。
  ip_max_login_fail: 30
  # /auth/refresh 每 IP 每分钟的请求上限（纯防刷，刷新接口没有凭据猜测面）。
  # 设为 0 表示关闭。默认 120。
  refresh_rate_limit: 120
  # 可信反向代理的 IP / 网段。
  # 留空 = 不信任任何代理，ClientIP 只取 TCP 对端地址，这是安全默认值。
  # 只有部署在 Nginx 等代理之后才填写，例如 ["127.0.0.1", "10.0.0.0/8"]。
  # 一旦把不受控的地址填进来，客户端就能用 X-Forwarded-For 伪造审计日志的来源 IP。
  # 也可用环境变量覆盖：NOVA_SECURITY_TRUSTED_PROXIES=127.0.0.1,10.0.0.0/8
  trusted_proxies: []
