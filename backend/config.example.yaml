# Nova ERP 服务端配置模板
#
# 用法：复制本文件为同目录的 config.yaml，按实际情况填写后再启动服务。
#     cp config.example.yaml config.yaml
#
# 为什么 config.yaml 不进版本库：
#   它包含数据库口令。真实口令一旦提交就会永久留在 git 历史里，
#   即使后续改回来也能从历史中读到。
#
# 相对路径的基准：**可执行文件所在目录**（不是启动时的工作目录）。
#   这样用计划任务 / Windows 服务启动时，日志、备份、前端产物不会落到
#   C:\Windows\System32 里。绝对路径（如 D:/backup）则原样使用。
#
# 环境变量覆盖：并非全部字段都支持，目前支持下面这些（NOVA_<SECTION>_<KEY>）：
#   NOVA_APP_NAME / MODE / HOST / PORT / PREFIX / VERSION / RELEASE / SWAGGER
#   NOVA_APP_METRICS / METRICS_TOKEN / WEB_DIR / DEMO_DATA
#   NOVA_DATABASE_HOST / PORT / USER / PASSWORD / DBNAME / SSLMODE / TIMEZONE
#   NOVA_DATABASE_MAX_IDLE_CONNS / MAX_OPEN_CONNS / LOG_LEVEL
#   NOVA_JWT_SECRET / ISSUER / ACCESS_EXPIRE / REFRESH_EXPIRE
#   NOVA_LOG_LEVEL / FORMAT / DIR / FILE
#   NOVA_SECURITY_MAX_LOGIN_FAIL / LOGIN_LOCK_SECONDS / TRUSTED_PROXIES
# cors / backup / maintenance / upgrade 四段只能用配置文件，没有环境变量。
app:
  name: nova-erp
  mode: release           # release | debug。本地开发可改 debug（会打开 swagger、gin 详细日志）
  host: 0.0.0.0           # 只允许本机访问可改 127.0.0.1；局域网访问保持 0.0.0.0 并配好防火墙
  port: 6082
  prefix: /api            # 路由统一前缀
  version: v1             # API 版本段，最终前缀为 /api/v1
  # 程序发布版本号（如 1.1.0），与上面的 version（API 版本段）是两件事。
  # 升级包校验、升级记录、启动后的「升级是否生效」核对都读它。
  # 优先级：本配置 > 构建注入（-ldflags "-X nova-erp/internal/config.appRelease=1.1.0"）> dev。
  # 为 dev 时升级后无法自动确认生效，记录会一直停在「已执行」。
  release: 1.1.3
  # 前端静态产物目录：目录里有 index.html 时由后端直接托管（含 SPA 深链回退），
  # 此时不需要额外架 Nginx；留空或不放产物则保持纯 API 形态。
  web_dir: web
  # 是否挂载在线接口文档（/swagger/index.html）。
  # 它会暴露全部路由与参数结构，生产环境保持关闭；需要时临时开。
  swagger: false
  # 首次初始化是否灌入演示业务数据（示例客户 / 供应商 / 商品 / 单据 / demo 账号）。
  # 本地开发、演示环境设 true 开箱可用；**交付真实客户必须 false**，
  # 否则对方第一次登录看到的是别人的假单据。
  demo_data: false
  # 是否挂载 /metrics 监控端点（Prometheus 文本格式）。默认关闭：
  # 该端点会暴露路由表、请求量与状态码分布。接入 Prometheus 时才打开。
  metrics: false
  # 非空时，抓取 /metrics 必须带 Authorization: Bearer <token>。
  metrics_token: ""

database:
  host: 127.0.0.1
  port: 5432
  # 建议给本系统单独建一个账号并授予该库的全部权限，而不是直接用 postgres。
  # 自动建库需要账号具备 CREATEDB；库已存在时普通权限即可。
  user: postgres
  password: CHANGE_ME     # ← 改成你本机 PostgreSQL 的口令
  dbname: nova_inv_v5      # 库不存在时会自动创建（显式用 template0，中文 Windows 也能建 UTF8 库）
  sslmode: disable
  timezone: Asia/Shanghai
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600   # 秒
  log_level: warn           # silent | error | warn | info
  # 单条 SQL 在 PostgreSQL 侧的执行上限（毫秒），默认 30000。
  # 放在数据库侧才能真正掐断查询：应用层超时只能让调用方不再等待，
  # 查询本身仍在数据库里继续跑、继续占连接。
  statement_timeout: 30000

jwt:
  # 下面这个占位值是**故意让启动失败**的保护：照抄模板直接上线，等于用公开密钥
  # 签发超管令牌（任何拿到模板的人都能伪造登录）。启动时会明确拒绝并提示替换。
  # 生成一个：openssl rand -base64 48
  secret: CHANGE_ME_USE_A_RANDOM_LONG_STRING
  issuer: nova-erp
  access_expire: 7200       # 访问令牌有效期（秒），默认 2 小时
  refresh_expire: 604800    # 刷新令牌有效期（秒），默认 7 天

log:
  level: info               # debug | info | warn | error
  format: console           # console | json
  dir: ./logs               # 相对可执行文件目录；留空则不落盘，只输出到 stdout
  file: app.log
  # 落盘轮转：单文件超限切分，保留 N 个备份，超龄清理。三项都可不写（走默认 100 / 7 / 30）。
  # 不配轮转的话，长时间运行的单个日志文件会一直增长直到吃满磁盘。
  max_size_mb: 100          # 单个日志文件大小上限（MB）
  max_backups: 7            # 最多保留的历史文件个数
  max_age_days: 30          # 历史文件保留天数

cors:
  # 前后端同源（后端托管前端产物）时**留空**，一个头都不需要发。
  # 只有前端单独部署在别的域名/端口时才填具体来源，例如：
  #   allow_origins: ["https://erp.example.com"]
  # 不要填 "*"：那等于允许任意站点代发请求。
  allow_origins: []

security:
  # 登录失败连续锁定阈值（按「账号 + 来源 IP」计数）
  max_login_fail: 5
  # 锁定时间（秒）
  login_lock_seconds: 300
  # 同一来源 IP 在一个锁定窗口内的登录失败上限，用于拦截「一个出口 IP 撞库大量账号」。
  # 只统计失败：登录成功即清零，因此不会牵连 NAT / 公司网关后的正常用户。
  # 设为 0 表示关闭。默认 30。
  ip_max_login_fail: 30
  # /auth/refresh 每 IP 每分钟的请求上限（纯防刷，刷新接口没有凭据猜测面）。
  # 设为 0 表示关闭。默认 120。
  refresh_rate_limit: 120
  # 可信反向代理的 IP / 网段。
  # 留空 = 不信任任何代理，ClientIP 只取 TCP 对端地址，这是安全默认值。
  # 只有部署在 Nginx 等代理之后才填写，例如 ["127.0.0.1", "10.0.0.0/8"]。
  # 一旦把不受控的地址填进来，客户端就能用 X-Forwarded-For 伪造审计日志的来源 IP。
  # 也可用环境变量覆盖：NOVA_SECURITY_TRUSTED_PROXIES=127.0.0.1,10.0.0.0/8
  trusted_proxies: []

backup:
  # 备份输出目录（相对可执行文件目录）。该目录**必须**同步到第二块盘：
  # 备份和数据同盘等于没有备份。也可以直接写绝对路径指向另一块盘。
  dir: ./backups
  # 保留最近多少份。与 keep_months 取并集，最新一份永不删除。
  keep_count: 30
  # 最近多少个月，每月至少留一份月档。防止长期停更后把唯一的旧档挤掉。
  keep_months: 6
  # pg_dump / pg_restore 路径。留空则自动探测（PATH → PostgreSQL 安装目录）。
  # 客户端版本低于服务器版本会报 server version mismatch，这时要显式指定。
  pg_dump_path: ""
  pg_restore_path: ""

maintenance:
  # 各类数据的保留天数（0 = 用默认值）。清理默认 dry-run，加 --apply 才真删。
  op_log_days: 180        # 操作日志
  login_log_days: 180     # 登录日志（实际还会受账号锁定窗口约束，取更早者）
  idempotency_days: 7     # 幂等键「过期之后」再保留多少天

upgrade:
  # 前端产物目录（vite build 输出）。升级包里带前端部分时，会原子替换这个目录，
  # 旧目录保留为 <dir>.old.<时间戳> 以便回滚。留空表示「本次只升后端」。
  # 默认与 app.web_dir 指向同一处：后端托管的那份就是升级要换的那份。
  frontend_dir: web
  # 升级包暂存目录。留空取 <可执行文件所在目录>/upgrade/staging。
  # 放在可执行文件旁边而不是系统临时目录：升级是跨重启的动作，
  # 计划生成后要等人点「执行」，期间重启或清理临时目录都会让它丢掉。
  staging_dir: ""
